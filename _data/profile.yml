research:
  - title: "Fatigue-Aware Multi-Parameter Policy Learning for Upper-Limb Exoskeleton Control"
    type: "Publication"
    venue: "IEEE/ASME (AIM) International Conference "
    date: "2026"
    description: "提出一套具疲勞感知能力的上肢復健外骨骼控制框架，結合強化學習、動態運動基元（DMP）與可變剛度控制，依使用者疲勞程度自適應調整運動目標、速度與剛度。模擬結果顯示，此方法在高疲勞狀態下能顯著降低追蹤誤差，展現多參數策略學習在長時間復健控制中的潛力。"
    cover: "" # 例如 /research-1.jpg
