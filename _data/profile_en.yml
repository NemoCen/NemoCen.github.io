research:
  - title: "Fatigue-Aware Multi-Parameter Policy Learning for Upper-Limb Exoskeleton Control"
    type: "Publication"
    venue: "IEEE/ASME (AIM) International Conference"
    date: "2026"
    description: "This work proposes a fatigue-aware control framework for an upper-limb rehabilitation exoskeleton. It combines reinforcement learning, dynamic movement primitives (DMPs), and variable stiffness control to adapt movement targets, speed, and stiffness to the user's fatigue level. Simulation results show that the method significantly reduces tracking error under high fatigue, demonstrating the potential of multi-parameter policy learning for prolonged rehabilitation control."
